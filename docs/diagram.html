<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Diagrama da Arquitetura Proposta - Versão 2</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f8fafc;
      margin: 0;
      padding: 24px;
      color: #0f172a;
    }
    .container {
      max-width: 1100px;
      margin: 0 auto;
      background: white;
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
    }
    h1 {
      margin-top: 0;
      text-align: center;
      color: #111827;
    }
    .subtitle {
      text-align: center;
      color: #64748b;
      margin-bottom: 20px;
    }
    svg {
      width: 100%;
      height: auto;
      display: block;
    }
    .title-box {
      fill: #2563eb;
      color: white;
    }
    .step-box {
      fill: #ffffff;
      stroke: #cbd5e1;
      stroke-width: 2;
      rx: 12;
      ry: 12;
    }
    .step-box-blue {
      fill: #eff6ff;
      stroke: #60a5fa;
      stroke-width: 2;
      rx: 12;
      ry: 12;
    }
    .step-box-green {
      fill: #ecfdf5;
      stroke: #34d399;
      stroke-width: 2;
      rx: 12;
      ry: 12;
    }
    .step-text {
      fill: #0f172a;
      font-size: 14px;
      font-weight: 600;
    }
    .step-sub {
      fill: #64748b;
      font-size: 12px;
    }
    .arrow {
      stroke: #475569;
      stroke-width: 2.2;
      fill: none;
      marker-end: url(#arrowhead);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Arquitetura proposta para processamento PIX</h1>
    <p class="subtitle">Fluxo simples, assíncrono e escalável</p>

    <svg viewBox="0 0 980 520" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="8" refY="3.5" orient="auto">
          <polygon points="0 0, 10 3.5, 0 7" fill="#475569"></polygon>
        </marker>
      </defs>

      <rect x="40" y="40" width="900" height="440" rx="18" ry="18" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

      <rect x="80" y="90" width="180" height="72" rx="14" ry="14" class="step-box-blue"/>
      <text x="170" y="122" text-anchor="middle" class="step-text">Cliente</text>
      <text x="170" y="143" text-anchor="middle" class="step-sub">Envio da transação</text>

      <line x1="260" y1="126" x2="330" y2="126" class="arrow"/>

      <rect x="330" y="90" width="180" height="72" rx="14" ry="14" class="step-box-blue"/>
      <text x="420" y="122" text-anchor="middle" class="step-text">API Spring Boot</text>
      <text x="420" y="143" text-anchor="middle" class="step-sub">Recebe e valida</text>

      <line x1="510" y1="126" x2="580" y2="126" class="arrow"/>

      <rect x="580" y="90" width="185" height="72" rx="14" ry="14" class="step-box"/>
      <text x="670" y="122" text-anchor="middle" class="step-text">PostgreSQL</text>
      <text x="670" y="143" text-anchor="middle" class="step-sub">Persiste transação - cache REDIS</text>

      <line x1="670" y1="162" x2="670" y2="220" class="arrow"/>

      <rect x="580" y="220" width="180" height="72" rx="14" ry="14" class="step-box"/>
      <text x="670" y="252" text-anchor="middle" class="step-text">Outbox</text>
      <text x="670" y="273" text-anchor="middle" class="step-sub">Registra evento</text>

      <line x1="670" y1="292" x2="670" y2="350" class="arrow"/>

      <rect x="580" y="350" width="180" height="72" rx="14" ry="14" class="step-box-blue"/>
      <text x="670" y="382" text-anchor="middle" class="step-text">Kafka</text>
      <text x="670" y="403" text-anchor="middle" class="step-sub">Publica e distribui</text>

      <line x1="760" y1="386" x2="830" y2="386" class="arrow"/>

      <rect x="830" y="350" width="150" height="72" rx="14" ry="14" class="step-box-green"/>
      <text x="890" y="382" text-anchor="middle" class="step-text">Consumer</text>
      <text x="890" y="403" text-anchor="middle" class="step-sub">Processa PIX - atualiza cache</text>

      <line x1="890" y1="350" x2="890" y2="300" class="arrow"/>

      <rect x="830" y="220" width="120" height="72" rx="14" ry="14" class="step-box"/>
      <text x="890" y="252" text-anchor="middle" class="step-text">Instituição</text>
      <text x="890" y="273" text-anchor="middle" class="step-sub">Financeira</text>

      <line x1="830" y1="256" x2="760" y2="256" class="arrow"/>

      <rect x="80" y="350" width="420" height="80" rx="14" ry="14" fill="#eef2ff" stroke="#818cf8" stroke-width="2"/>
      <text x="290" y="382" text-anchor="middle" class="step-text">Resumo</text>
      <text x="290" y="403" text-anchor="middle" class="step-sub">API rápida + processamento assíncrono + retry resiliente</text>
    </svg>
  </div>
</body>
</html>
